<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Monitor/Screen -->
  <rect x="116" y="96" width="280" height="200" rx="16" fill="white" opacity="0.95"/>
  <!-- Screen content - receipt lines -->
  <rect x="148" y="136" width="160" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="148" y="164" width="120" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="148" y="192" width="180" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="148" y="220" width="100" height="12" rx="6" fill="#c7d2fe"/>
  <!-- Price on screen -->
  <rect x="308" y="244" width="60" height="20" rx="6" fill="#4f46e5"/>
  <!-- Stand -->
  <rect x="224" y="296" width="64" height="24" rx="4" fill="white" opacity="0.7"/>
  <rect x="196" y="316" width="120" height="12" rx="6" fill="white" opacity="0.6"/>
  <!-- Card/Payment icon -->
  <rect x="320" y="348" width="96" height="64" rx="12" fill="white" opacity="0.9"/>
  <rect x="336" y="364" width="40" height="10" rx="3" fill="#fbbf24"/>
  <rect x="336" y="382" width="64" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="336" y="394" width="40" height="6" rx="3" fill="#c7d2fe"/>
  <!-- Dollar sign -->
  <circle cx="160" cy="388" r="44" fill="white" opacity="0.15"/>
  <text x="160" y="406" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="white" text-anchor="middle">$</text>
</svg>
