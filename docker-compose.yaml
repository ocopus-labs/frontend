version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    labels:
      - 'coolify.managed=true'
      - 'coolify.service.type=app'
      - 'coolify.service.name=frontend'
    restart: unless-stopped
